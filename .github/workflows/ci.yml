name: CI

on:
  pull_request:
  push:
    branches: [main, staging, production]
  workflow_call:
    inputs:
      source_ref:
        description: Exact revision to test before deployment
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Domain and API boundary regressions
        run: pnpm test:unit
      - name: Typography lint
        run: pnpm lint:typography
      - name: Button hierarchy lint
        run: pnpm lint:buttons
      - name: Type check
        run: pnpm type-check
      - name: Build
        run: pnpm -r build

  database-invariants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crewmodo_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crewmodo_ci_test
      CREWMODO_RESET_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration, tenant isolation, concurrent approvals and OCR budgets
        run: pnpm test:integration

  browser-regressions:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - name: Signup and mobile workflow regressions
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
